<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <!-- Background: clean white -->
  <rect width="1200" height="300" fill="#FAFAFA"/>

  <!-- Right panel: GitHub dark -->
  <rect x="720" y="0" width="480" height="300" fill="#0D1117"/>

  <!-- LEFT SIDE -->

  <text x="80" y="80" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="3">
    OPEN-SOURCE PROJECT
  </text>

  <text x="80" y="160" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="72" font-weight="700" fill="#0D1117" letter-spacing="-2.5">
    tabsynth
  </text>

  <text x="82" y="200" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1F2937" letter-spacing="-0.2">
    Auto-adaptive synthetic
  </text>
  <text x="82" y="226" font-family="Inter, -apple-system, system-ui, sans-serif" font-size="20" font-weight="400" fill="#1F2937" letter-spacing="-0.2">
    tabular data generation
  </text>

  <text x="82" y="258" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="400" fill="#6B7280">
    diffusion · GDPR-compliant · auto-tuned
  </text>

  <!-- RIGHT SIDE: dark panel with diagram -->

  <text x="755" y="60" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="3">
    PIPELINE
  </text>

  <!-- Diagram: 3 boxes, all consistent, fully monochrome -->
  <g transform="translate(755, 100)" font-family="Inter, -apple-system, sans-serif" font-size="11">

    <!-- Box 1: CSV input -->
    <rect x="0" y="35" width="65" height="40" fill="none" stroke="#FAFAFA" stroke-width="1.2" rx="4"/>
    <text x="32.5" y="59" text-anchor="middle" fill="#FAFAFA" font-weight="600" font-size="12">CSV</text>

    <!-- Arrow -->
    <line x1="68" y1="55" x2="86" y2="55" stroke="#6B7280" stroke-width="1"/>
    <polygon points="86,55 80,52 80,58" fill="#6B7280"/>

    <!-- Box 2: Pipeline core -->
    <rect x="89" y="15" width="180" height="80" fill="none" stroke="#FAFAFA" stroke-width="1.2" rx="4"/>
    <text x="179" y="35" text-anchor="middle" fill="#FAFAFA" font-weight="700" font-size="12">5-phase pipeline</text>
    <line x1="120" y1="44" x2="238" y2="44" stroke="#FAFAFA" stroke-width="1" stroke-linecap="round"/>
    <text x="179" y="60" text-anchor="middle" fill="#9CA3AF" font-size="10.5">analyze · preprocess</text>
    <text x="179" y="74" text-anchor="middle" fill="#9CA3AF" font-size="10.5">diffuse · generate</text>
    <text x="179" y="88" text-anchor="middle" fill="#9CA3AF" font-size="10.5">evaluate</text>

    <!-- Arrow -->
    <line x1="271" y1="55" x2="289" y2="55" stroke="#6B7280" stroke-width="1"/>
    <polygon points="289,55 283,52 283,58" fill="#6B7280"/>

    <!-- Box 3: synthetic CSV output -->
    <rect x="292" y="35" width="115" height="40" fill="none" stroke="#FAFAFA" stroke-width="1.2" rx="4"/>
    <text x="349.5" y="59" text-anchor="middle" fill="#FAFAFA" font-weight="600" font-size="12">synthetic CSV</text>
  </g>
</svg>
